name: Security CI

on:
  push:
    branches:
      - security/hono-4.13.9-20260926
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/security-ci.yml
      - src/**
      - tests/**
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/security-ci.yml
      - src/**
      - tests/**

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify runner
        run: node --version && npm --version

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify Hono lock consistency
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.dependencies.hono!=='4.13.9'||l.packages[''].dependencies.hono!=='4.13.9'||l.packages['node_modules/hono'].version!=='4.13.9') process.exit(1)"

      - name: Run provider-free repository tests
        run: npm test
